[project]
name = "pjecz-carina-api-key"
version = "2.3.0"
description = "API para recibir exhortos"
readme = "README.md"
authors = [
    { name = "Guillermo Valdes", email = "guillermo.valdes@pjecz.gob.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "fastapi-pagination[sqlalchemy]>=0.15.16",
    "google-auth>=2.57.0",
    "google-cloud>=0.34.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.13.1",
    "gunicorn>=26.2.0",
    "hashids>=1.3.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pytz>=2026.3.post1",
    "sqlalchemy>=2.0.52",
    "sqlalchemy-utils>=0.42.1",
    "unidecode>=1.4.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "faker>=40.37.0",
    "isort>=8.0.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821"]
line-length = 128
